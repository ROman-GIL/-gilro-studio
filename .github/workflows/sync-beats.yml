name: Sync Beats from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests gdown

      - name: Download beats
        env:
          CATALOG_URL: https://script.google.com/macros/s/AKfycbyhgFVpqZ0UGX_EXv3H2eVZ9s2tm-o2EHcrp405X3iq294h5pqlJa4NuKVh91KuS05q/exec
        run: |
          python - <<'PY'
          import os
          import re
          import requests
          import gdown

          url = os.environ["CATALOG_URL"]
          response = requests.get(url, timeout=30)
          response.raise_for_status()

          data = response.json()
          if not data.get("ok"):
              raise RuntimeError(data.get("error", "목록 조회 실패"))

          os.makedirs("beats", exist_ok=True)

          for beat in data["beats"]:
              file_id = beat["id"]
              filename = os.path.basename(beat["name"])

              if not re.fullmatch(r"[\w가-힣 .()\-]+\.(mp3|wav|m4a)", filename, re.I):
                  print("Skipping invalid filename:", filename)
                  continue

              output = os.path.join("beats", filename)

              print("Downloading:", filename)
              result = gdown.download(
                  id=file_id,
                  output=output,
                  quiet=False,
              )

              if not result:
                  raise RuntimeError("다운로드 실패: " + filename)

          PY

      - name: Commit downloaded beats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beats/
          if ! git diff --cached --quiet; then
            git commit -m "Sync beats from Google Drive"
            git push
          fi
